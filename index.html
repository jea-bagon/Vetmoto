<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vetmoto | Pet Clinic</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #faf8f7; color: #332d2d; }
header { background: white; border-bottom: 2px solid #e9dedd; padding: 14px 5%; display: flex; align-items: center; gap: 15px; }
header img { width: 66px; height: 66px; object-fit: contain; }
header h2 { margin: 0; letter-spacing: 2px; }
header h2 span { color: #922b30; }
header small { color: #866b6b; }
main { max-width: 1120px; margin: 25px auto; padding: 0 16px; }
h1 { font-size: 28px; margin-bottom: 5px; }
h3 { margin: 6px 0 15px; }
p { line-height: 1.5; }
.muted { color: #827878; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
.card { background: white; border: 1px solid #e9dfdd; border-radius: 13px; padding: 18px; margin-bottom: 16px; }
.stat { border-top: 4px solid #922b30; }
.stat strong { display: block; font-size: 27px; color: #922b30; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
button { padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; font: inherit; }
button.primary, .tabs button.active { background: #922b30; color: white; }
button.secondary { background: #f5e9e8; color: #79292d; }
button.danger { background: #fbe9e9; color: #9b2525; }
.tabs button { background: white; border: 1px solid #e8dddb; }
input, select, textarea { width: 100%; padding: 10px; border: 1px solid #d7cbca; border-radius: 7px; font: inherit; }
label { display: block; margin-bottom: 12px; font-weight: bold; font-size: 13px; }
label input, label select, label textarea { margin-top: 5px; font-weight: normal; }
textarea { min-height: 70px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
.toolbar input { max-width: 350px; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 580px; }
th, td { border-bottom: 1px solid #f0e8e6; padding: 11px; text-align: left; font-size: 13px; }
th { background: #fbf5f4; }
td button { padding: 6px 9px; margin: 2px; font-size: 12px; }
.page { display: none; }
.page.active { display: block; }
.notice { background: #fbf0e3; color: #75491b; padding: 12px; border-radius: 8px; }
.empty { color: #807575; padding: 22px; text-align: center; }
.modal-bg { display: none; position: fixed; inset: 0; z-index: 10; background: #201719aa; align-items: center; justify-content: center; padding: 15px; }
.modal { width: min(660px,100%); max-height: 90vh; overflow-y: auto; background: white; padding: 22px; border-radius: 13px; }
.buttons { display: flex; gap: 8px; justify-content: flex-end; }
.timeline-item { padding: 12px 15px; border-left: 3px solid #922b30; background: #fcf7f6; margin-bottom: 10px; }
@media (max-width: 730px) { .stats { grid-template-columns: repeat(2,1fr); } .grid { grid-template-columns: 1fr; } h1 { font-size: 23px; } }
/* Simple pet overview cards */
.overview-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(250px,1fr)); gap: 12px; margin-top: 15px; }
.overview-pet { border: 1px solid #e9dfdd; border-radius: 10px; padding: 15px; background: #fffafa; }
.overview-pet h3 { color: #922b30; }
.overview-pet p { margin: 6px 0; font-size: 14px; }
</style>
</head>

<main>
  <h1>Pet Clinic Management System</h1>
  <p class="muted">Manage pets, consultations, services, and care reminders.</p>
  <div class="stats">

    <button onclick="showPage('visits', this)">Consultations</button>
    <button onclick="showPage('services', this)">Clinic Services</button>
    <button onclick="showPage('reminders', this)">Care Reminders</button>

  <section id="pets" class="page active card">

  <section id="visits" class="page card">

  <section id="services" class="page card">

  <section id="reminders" class="page card">

function id() { return 'rec_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function clean(value) { return String(value || '').trim().replace(/\s+/g,' ').toLowerCase(); }
function safe(value) { return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n) { return '₱' + Number(n || 0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function petName(petId) { return data.pets.find(p=>p.id===petId)?.name || 'Unknown pet'; }
function save() {
  try { localStorage.setItem(KEY,JSON.stringify(data)); }
  catch(error) { alert('Your browser could not save the changes.'); }
  render();
}
function showPage(name, button) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $(name).classList.add('active');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
}
function table(headers, rows) {
  if (!rows.length) return '<p class="empty">No records found.</p>';
  return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>';
}
function actions(type,recordId) {
  return `<button class="secondary" data-edit="${safe(type)}" data-id="${safe(recordId)}">Edit</button><button class="danger" data-delete="${safe(type)}" data-id="${safe(recordId)}">Delete</button>`;
}
// Show all pet profiles in one place. This uses the existing pet records.
function renderOverview() {
  const search = clean($('overviewSearch').value);
  const pets = data.pets.filter(p => clean(p.name + ' ' + p.owner).includes(search)).sort((a,b) => a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));
  let html = '';
  for (const p of pets) {
    const visits = data.visits.filter(v => v.petId === p.id);
    const reminders = data.reminders.filter(r => r.petId === p.id && !r.done);
    html += `<div class="overview-pet">
      <h3> ${safe(p.name)}</h3>
      <p><b>Owner:</b> ${safe(p.owner)}</p>
      <p><b>Species:</b> ${safe(p.species)}</p>
      <p><b>Breed:</b> ${safe(p.breed)}</p>
      <p><b>Sex:</b> ${safe(p.sex || 'Not recorded')}</p>
      <p><b>Birth Date:</b> ${safe(p.birth || 'Not recorded')}</p>
      <p><b>Consultations:</b> ${visits.length}</p>
      <p><b>Pending Reminders:</b> ${reminders.length}</p>
      <p><b>Latest Visit:</b> ${safe(visits.length ? [...visits].sort((a,b) => b.date.localeCompare(a.date))[0].date : 'No visits yet')}</p>
    </div>`;
  }
  $('overviewList').innerHTML = html || '<p class="empty">No pets found.</p>';
}

function render() {
  renderOverview();
  $('totalPets').textContent = data.pets.length;
  $('totalVisits').textContent = data.visits.length;
  $('totalServices').textContent = data.services.length;
  $('totalReminders').textContent = data.reminders.filter(r=>!r.done).length;
  let pq = clean($('petSearch').value);
  let sq = clean($('serviceSearch').value);
  $('petTable').innerHTML = table(['Pet','Owner','Species / Breed','Actions'],data.pets.filter(p=>clean(p.name+' '+p.owner).includes(pq)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'})).map(p=>`<tr><td>${safe(p.name)}</td><td>${safe(p.owner)}</td><td>${safe(p.species)} / ${safe(p.breed)}</td><td>${actions('pet',p.id)}</td></tr>`));
  $('visitTable').innerHTML = table(['Date','Pet','Service','Symptoms / Reason','Charge','Actions'],[...data.visits].sort((a,b)=>b.date.localeCompare(a.date)).map(v=>`<tr><td>${safe(v.date)}</td><td>${safe(petName(v.petId))}</td><td>${safe(v.serviceName)}</td><td>${safe(v.symptoms)}</td><td>${money(v.charge)}</td><td>${actions('visit',v.id)}</td></tr>`));
  $('serviceTable').innerHTML = table(['Service','Category','Price','Actions'],data.services.filter(s=>clean(s.name+' '+s.category).includes(sq)).map(s=>`<tr><td>${safe(s.name)}</td><td>${safe(s.category)}</td><td>${money(s.price)}</td><td>${actions('service',s.id)}</td></tr>`));
  $('reminderTable').innerHTML = table(['Pet','Reminder','Due Date','Status','Actions'],[...data.reminders].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>`<tr><td>${safe(petName(r.petId))}</td><td>${safe(r.title)}</td><td>${safe(r.date)}</td><td>${r.done?'Completed':r.date<localDate()?'Overdue':'Pending'}</td><td><button class="secondary" data-toggle="${safe(r.id)}">${r.done?'Undo':'Complete'}</button>${actions('reminder',r.id)}</td></tr>`));
  const sel=$('historyPet');
  const previous=selectedHistoryPet || sel.value;
  sel.innerHTML=data.pets.map(p=>`<option value="${safe(p.id)}">${safe(p.name)} — ${safe(p.owner)}</option>`).join('');
  if(data.pets.some(p=>p.id===previous))sel.value=previous;
  selectedHistoryPet=sel.value;
  renderHistory();
}
function renderHistory() {
  const pid=$('historyPet').value;
  selectedHistoryPet=pid;
  const visits=data.visits.filter(v=>v.petId===pid).map(v=>({date:v.date,title:v.serviceName,detail:v.symptoms+' | Treatment: '+(v.treatment||'Not recorded')+' | Charge: '+money(v.charge)}));
  const reminders=data.reminders.filter(r=>r.petId===pid).map(r=>({date:r.date,title:'Reminder: '+r.title,detail:r.done?'Completed':'Pending'}));
  const items=[...visits,...reminders].sort((a,b)=>b.date.localeCompare(a.date));
  const overdue=data.reminders.filter(r=>r.petId===pid&&!r.done&&r.date<localDate()).length;
  const counts={};
  visits.forEach(v=>{const key=clean(v.detail.split(' | ')[0]); if(key)counts[key]=(counts[key]||0)+1;});
  const recurring=Object.keys(counts).filter(k=>counts[k]>=2);
  $('healthAlerts').textContent=overdue+' overdue reminder(s). '+(recurring.length?'Repeated symptoms/reasons: '+recurring.join(', ')+'. A veterinarian should review.':'No repeated symptoms or reasons detected.');
  $('historyList').innerHTML=items.map(x=>`<div class="timeline-item"><strong>${safe(x.date)} · ${safe(x.title)}</strong><p>${safe(x.detail)}</p></div>`).join('') || '<p class="empty">No medical history yet.</p>';
}
function input(name,label,value='',type='text',required=true) {
  return `<label>${label}<input name="${name}" type="${type}" value="${safe(value)}" ${required?'required':''}></label>`;
}
function select(name,label,options,value='',required=true) {
  return `<label>${label}<select name="${name}" ${required?'required':''}>${options.map(o=>`<option value="${safe(o[0])}" ${o[0]===value?'selected':''}>${safe(o[1])}</option>`).join('')}</select></label>`;
}
function petOptions() { return [['','Select pet'],...data.pets.map(p=>[p.id,p.name+' — '+p.owner])]; }
function serviceOptions() { return [['','Select service'],...data.services.map(s=>[s.id,s.name+' ('+money(s.price)+')'])]; }
function openForm(type,recordId='') {
  if ((type==='visit'||type==='reminder')&&!data.pets.length) return alert('Register a pet first.');
  editingType=type; editingId=recordId;
  let list=data[type==='pet'?'pets':type==='visit'?'visits':type==='service'?'services':'reminders'];
  let x=list.find(r=>r.id===recordId) || {};
  $('formTitle').textContent=(recordId?'Edit ':'Add ')+type.charAt(0).toUpperCase()+type.slice(1);
  let html='';
  if(type==='pet') html=input('name','Pet Name',x.name)+input('owner','Owner Name',x.owner)+select('species','Species',['Dog','Cat','Bird','Rabbit','Other'].map(a=>[a,a]),x.species||'Dog')+input('breed','Breed',x.breed)+select('sex','Sex',['Male','Female','Unknown'].map(a=>[a,a]),x.sex||'Unknown')+input('birth','Birth Date',x.birth||'','date',false);
  if(type==='service') html=input('name','Service Name',x.name)+select('category','Category',['Consultation','Vaccination','Grooming','Treatment','Diagnostics','Other'].map(a=>[a,a]),x.category||'Consultation')+input('price','Price (PHP)',x.price??0,'number');
  if(type==='visit') html=select('petId','Pet',petOptions(),x.petId)+input('date','Visit Date',x.date||localDate(),'date')+select('serviceId','Clinic Service',serviceOptions(),x.serviceId)+input('symptoms','Symptoms / Reason for Visit',x.symptoms)+`<label>Treatment / Notes<textarea name="treatment">${safe(x.treatment)}</textarea></label>`+input('charge','Charge (PHP)',x.charge??0,'number')+input('followup','Follow-up Date (optional)',x.followup||'','date',false);
  if(type==='reminder') html=select('petId','Pet',petOptions(),x.petId)+input('title','Reminder Title',x.title)+input('date','Due Date',x.date||localDate(),'date')+select('done','Status',[['false','Pending'],['true','Completed']],String(x.done??false));
  $('formFields').innerHTML='<div class="grid">'+html+'</div>';
  $('modalBg').style.display='flex';
  if(type==='visit') {
    $('recordForm').elements.serviceId.onchange=function() {
      const service=data.services.find(s=>s.id===this.value);
      if(service)$('recordForm').elements.charge.value=service.price;
    };
  }
}
function closeForm() { $('modalBg').style.display='none'; }
function localDate() { return new Date().toLocaleDateString('en-CA'); }
function submitForm(event) {
  event.preventDefault();
  const form=new FormData($('recordForm'));
  const values=Object.fromEntries(form.entries());
  const type=editingType;
  const list=data[type==='pet'?'pets':type==='visit'?'visits':type==='service'?'services':'reminders'];
  const old=list.find(x=>x.id===editingId);
  const record={...old,...values,id:editingId||id()};
  if(type==='pet') {
    if(data.pets.some(p=>p.id!==record.id&&clean(p.name)===clean(record.name)&&clean(p.owner)===clean(record.owner)&&clean(p.species)===clean(record.species)&&clean(p.breed)===clean(record.breed)))return alert('Duplicate pet record already exists.');
    if(record.birth&&record.birth>localDate())return alert('Birth date cannot be in the future.');
  }
  if(type==='service') {
    record.price=Number(record.price);
    if(record.price<0||!Number.isFinite(record.price))return alert('Enter a valid price.');
    if(data.services.some(s=>s.id!==record.id&&clean(s.name)===clean(record.name)))return alert('Duplicate service name already exists.');
  }
  if(type==='visit') {
    if(!record.petId||!record.serviceId)return alert('Choose a pet and a service.');
    record.charge=Number(record.charge);
    if(record.charge<0||!Number.isFinite(record.charge))return alert('Enter a valid charge.');
    record.serviceName=data.services.find(s=>s.id===record.serviceId)?.name||'Service';
    if(data.visits.some(v=>v.id!==record.id&&v.petId===record.petId&&v.date===record.date&&v.serviceId===record.serviceId&&clean(v.symptoms)===clean(record.symptoms)))return alert('Duplicate consultation already exists.');
  }
  if(type==='reminder') {
    if(!record.petId)return alert('Choose a pet.');
    record.done=record.done==='true';
    if(data.reminders.some(r=>r.id!==record.id&&r.petId===record.petId&&r.date===record.date&&clean(r.title)===clean(record.title)))return alert('Duplicate reminder already exists.');
  }
  if(old)Object.assign(old,record); else list.push(record);
  if(type==='visit'&&record.followup){
    const reminderTitle='Follow-up: '+record.symptoms;
    const exists=data.reminders.some(r=>r.petId===record.petId&&r.date===record.followup&&clean(r.title)===clean(reminderTitle));
    if(!exists)data.reminders.push({id:id(),petId:record.petId,title:reminderTitle,date:record.followup,done:false});
  }
  closeForm(); save();
}
function deleteRecord(type,recordId) {
  const key={pet:'pets',visit:'visits',service:'services',reminder:'reminders'}[type];
  if(!confirm('Delete this record?'))return;
  if(type==='pet') {
    if(data.visits.some(v=>v.petId===recordId)||data.reminders.some(r=>r.petId===recordId))return alert('Delete linked consultations and reminders before deleting this pet.');
  }
  data[key]=data[key].filter(x=>x.id!==recordId);
  save();
}
document.addEventListener('click',function(event){
  const b=event.target.closest('button');if(!b)return;
  if(b.dataset.edit)openForm(b.dataset.edit,b.dataset.id);
  if(b.dataset.delete)deleteRecord(b.dataset.delete,b.dataset.id);
  if(b.dataset.toggle){const r=data.reminders.find(x=>x.id===b.dataset.toggle);if(r){r.done=!r.done;save();}}
});
$('recordForm').addEventListener('submit',submitForm);
$('modalBg').addEventListener('click',e=>{if(e.target===$('modalBg'))closeForm();});
render();
</script>
</body>
</html>
